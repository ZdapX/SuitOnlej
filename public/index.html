<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suit Online - Modern Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; transition: all 0.2s; }
        .btn-primary { background-color: #4f46e5; color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; }
        .btn-primary:hover { background-color: #4338ca; }
        .hand-icon { font-size: 3rem; cursor: pointer; transition: transform 0.2s; padding: 20px; border-radius: 20px; background: #f1f5f9; }
        .hand-icon:hover { transform: translateY(-5px); background: #e2e8f0; }
        .hidden { display: none; }
    </style>
</head>
<body class="p-6">

    <div id="app" class="max-w-md mx-auto">
        <!-- Input Nama -->
        <div id="name-screen" class="space-y-6">
            <h1 class="text-3xl font-extrabold text-slate-900">Suit Online ✌️</h1>
            <div class="card p-6">
                <label class="block text-sm font-semibold mb-2">Nama Player</label>
                <input type="text" id="player-name" class="w-full border p-3 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Masukkan nama...">
                <button onclick="saveName()" class="w-full btn-primary shadow-lg shadow-indigo-200">Simpan & Lanjut</button>
            </div>
        </div>

        <!-- Lobby -->
        <div id="lobby-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 id="welcome-text" class="text-xl font-bold">Halo, Player</h2>
                <button onclick="logout()" class="text-red-500 text-sm">Ganti Nama</button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="createRoom()" class="card p-4 text-center hover:border-indigo-500">
                    <span class="block text-2xl mb-1">➕</span>
                    <span class="font-bold">Buat Room</span>
                </button>
                <button onclick="showJoinModal()" class="card p-4 text-center hover:border-indigo-500">
                    <span class="block text-2xl mb-1">🔑</span>
                    <span class="font-bold">Join Code</span>
                </button>
            </div>

            <div>
                <h3 class="font-bold text-slate-700 mb-3">Room Publik</h3>
                <div id="public-rooms" class="space-y-3">
                    <!-- List room di sini -->
                </div>
            </div>
        </div>

        <!-- Game Room -->
        <div id="game-screen" class="hidden space-y-6">
            <div class="card p-4 flex justify-between items-center bg-indigo-50 border-indigo-100">
                <div>
                    <p class="text-xs uppercase font-bold text-indigo-400 leading-none">Room Code</p>
                    <p id="display-room-code" class="text-lg font-extrabold text-indigo-900"></p>
                </div>
                <button onclick="exitRoom()" class="text-sm bg-white px-3 py-1 rounded-lg border">Keluar</button>
            </div>

            <div id="opponent-info" class="card p-4 text-center italic text-slate-500">
                Menunggu lawan bergabung...
            </div>

            <div id="player-list-admin" class="space-y-2"></div>

            <div id="game-area" class="card p-8 text-center hidden">
                <p class="mb-6 font-bold text-slate-700">Pilih Senjata Kamu:</p>
                <div class="flex justify-center gap-4">
                    <div onclick="sendMove('rock')" class="hand-icon">✊</div>
                    <div onclick="sendMove('paper')" class="hand-icon">🖐️</div>
                    <div onclick="sendMove('scissors')" class="hand-icon">✌️</div>
                </div>
                <p id="move-status" class="mt-6 text-indigo-600 font-semibold"></p>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = null;
        let myName = localStorage.getItem('playerName');

        if (myName) {
            document.getElementById('player-name').value = myName;
            showLobby();
        }

        function saveName() {
            const name = document.getElementById('player-name').value;
            if (!name) return alert('Nama harus diisi');
            localStorage.setItem('playerName', name);
            myName = name;
            showLobby();
        }

        function showLobby() {
            document.getElementById('name-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            document.getElementById('welcome-text').innerText = `Halo, ${myName}`;
        }

        function logout() {
            localStorage.removeItem('playerName');
            location.reload();
        }

        function createRoom() {
            socket.emit('create-room', { playerName: myName, isPrivate: false });
        }

        function showJoinModal() {
            const code = prompt("Masukkan Code Room:");
            if (code) socket.emit('join-room', { playerName: myName, roomCode: code.toUpperCase() });
        }

        function joinRoom(code) {
            socket.emit('join-room', { playerName: myName, roomCode: code });
        }

        function sendMove(move) {
            socket.emit('make-move', { roomCode: currentRoom.code, move });
            document.getElementById('move-status').innerText = "Menunggu lawan...";
        }

        socket.on('room-created', (room) => {
            currentRoom = room;
            openRoom();
        });

        socket.on('player-joined', (room) => {
            currentRoom = room;
            openRoom();
            const opponent = room.players.find(p => p.id !== socket.id);
            if (opponent) {
                document.getElementById('opponent-info').innerHTML = `Lawan: <b>${opponent.name}</b>`;
                document.getElementById('game-area').classList.remove('hidden');
            }
            
            // Render list untuk admin (kick button)
            const adminArea = document.getElementById('player-list-admin');
            adminArea.innerHTML = '';
            if (room.ownerId === socket.id) {
                room.players.forEach(p => {
                    if (p.id !== socket.id) {
                        adminArea.innerHTML = `<div class="flex justify-between items-center p-2 bg-white rounded-lg border border-red-100">
                            <span class="text-sm font-bold">${p.name} (Lawan)</span>
                            <button onclick="kickPlayer('${p.id}')" class="text-xs bg-red-500 text-white px-2 py-1 rounded">Tendang</button>
                        </div>`;
                    }
                });
            }
        });

        function kickPlayer(pid) {
            socket.emit('kick-player', { roomCode: currentRoom.code, playerId: pid });
        }

        socket.on('kicked', () => {
            alert("Kamu dikeluarkan dari room oleh pemilik.");
            location.reload();
        });

        socket.on('game-result', (players) => {
            const myMove = players.find(p => p.id === socket.id).move;
            const opp = players.find(p => p.id !== socket.id);
            const oppMove = opp.move;
            
            let result = "";
            const emoji = {rock: '✊', paper: '🖐️', scissors: '✌️'};

            if (myMove === oppMove) result = "Seri! 🤝";
            else if (
                (myMove === 'rock' && oppMove === 'scissors') ||
                (myMove === 'paper' && oppMove === 'rock') ||
                (myMove === 'scissors' && oppMove === 'paper')
            ) result = "Kamu Menang! 🎉";
            else result = "Kamu Kalah! 💀";

            alert(`Lawan memilih ${emoji[oppMove]}\n${result}`);
            document.getElementById('move-status').innerText = "";
        });

        socket.on('notification', (msg) => {
            alert(msg);
        });

        socket.on('update-room-list', (rooms) => {
            const container = document.getElementById('public-rooms');
            container.innerHTML = rooms.length ? '' : '<p class="text-slate-400 text-sm">Tidak ada room publik aktif.</p>';
            rooms.forEach(r => {
                container.innerHTML += `
                    <div class="card p-4 flex justify-between items-center">
                        <div>
                            <p class="font-bold">${r.code}</p>
                            <p class="text-xs text-slate-500">Player: ${r.players[0].name}</p>
                        </div>
                        <button onclick="joinRoom('${r.code}')" class="bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-xl text-sm font-bold">Join</button>
                    </div>
                `;
            });
        });

        socket.on('error-msg', (msg) => alert(msg));

        function openRoom() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = currentRoom.code;
        }

        function exitRoom() {
            location.reload();
        }
    </script>
</body>
</html>
